[package]
name = "quickstart-axum"
version = "0.0.0"
edition = "2021"
publish = false

# Stands alone so it can be built from anywhere in a checkout.
[workspace]

[dependencies]
# The facade only, from crates.io, exactly as the skill tells integrators to
# write it. The facade forwards `memory`, `axum`, `#[derive(AxumState)]`, etc.,
# so no sub-crate dependencies are needed.
authkestra = { version = "0.15", features = ["axum", "memory", "github"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
